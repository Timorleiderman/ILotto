name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group docs || uv sync --group docs

      - name: Ruff
        run: uv run ruff check bench scripts tests

      - name: Tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: uv run pytest -q

      # Smoke-test the report build without the neural models, so a broken
      # template fails the PR rather than the scheduled publish.
      - name: Build report (quick)
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: uv run python scripts/build_report.py --quick --n-test 100 --null-trials 500

      # --strict turns broken internal links and nav references into failures.
      - name: Build docs site
        run: uv run mkdocs build --strict
