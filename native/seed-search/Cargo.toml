[package]
name = "ilotto-seed-search"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = { version = "=0.10.9", features = ["compress", "asm"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
