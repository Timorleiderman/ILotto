site_name: ILotto
site_description: A reproducible study of the Israeli Lotto, from basic probability to neural networks and exact algorithms.
site_url: https://timorleiderman.github.io/ILotto/
repo_url: https://github.com/Timorleiderman/ILotto
repo_name: Timorleiderman/ILotto
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # navigation.instant is deliberately off: it re-injects pages via XHR and
    # leaves the mermaid containers empty, so diagrams vanish on the second
    # page you visit.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  # Renders ```mermaid fences as diagrams that follow the active colour scheme.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Lets the docs pull in legacy/ARCHITECTURES.md, so the exhibit keeps its
  # documentation next to its code.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start here:
      - The game in five minutes: start/the-game.md
      - Run it yourself: start/run.md
      - The dashboard: start/dashboard.md
      - Glossary: start/glossary.md
  - 1 · Measuring:
      - How results are measured: evaluation.md
      - Live scoreboard: results.md
      - Benchmark report: benchmark/index.html
  - 2 · Simple strategies:
      - approaches/index.md
      - Statistical strategies: approaches/statistical.md
      - The perfect-fit function: approaches/perfect-fit.md
      - Chaos theory: approaches/chaos.md
      - The golden ratio: approaches/golden-ratio.md
  - 3 · Neural networks:
      - The first attempt: approaches/legacy-models.md
      - Neural set prediction: approaches/set-prediction.md
      - Date-conditioned generative model: approaches/date-conditioned.md
  - 4 · Probability forecasts:
      - A mixture of 57 experts: algorithm-research.md
      - The 1,000-draw test: historical-strikes.md
      - Training on a million simulated draws: synthetic-learning.md
  - 5 · Algorithms for the ticket:
      - levers/index.md
      - Coverage at a fixed budget: approaches/ticket-generators.md
      - Strong-number assignment: ticket-chances.md
      - Which draw to play: levers/draw-planner.md
      - Is a ticket worth its price: levers/ticket-value.md
      - Every model's form for the next draw: levers/predict.md
  - 6 · Side quest:
      - Searching for a seed: side-quests/seed-search.md
  - Reference:
      - Experiment catalog: reference/experiments.md
      - Legacy architecture deep dive: reference/architectures.md
      - Research log:
          - reference/research-log/index.md
          - Progress and evidence: reference/research-log/progress.md
          - Prediction and probability: reference/research-log/prediction-probability.md
          - Coverage review: reference/research-log/coverage-review.md
          - Model design plan: reference/research-log/model-design-plan.md
          - Seed search pilot: reference/research-log/seed-search-pilot.md
          - Seed search campaign: reference/research-log/seed-search-campaign.md
          - Seed search capacity: reference/research-log/seed-search-capacity.md
          - Seed search engines: reference/research-log/seed-search-parallel.md
