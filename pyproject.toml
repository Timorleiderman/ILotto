[project]
name = "ilotto"
version = "0.1.0"
description = "An honest benchmark of lottery-prediction methods against the Israeli 6/37 Lotto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.1.0",
    "flake8>=7.1.2",
    "h5py>=3.13.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.1",
    "mdutils>=1.6.0",
    "numba>=0.61.0",
    "pandas>=2.2.3",
    "pydot>=3.0.4",
    "pydotplus>=2.0.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "ruff>=0.11.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "tensorflow>=2.19.0",
    "tqdm>=4.67.1",
]


[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` does not put the project root on sys.path the way
# `python -m pytest` does, so `bench` would not import under CI without this.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[project.optional-dependencies]
# CUDA is opt-in rather than the default, for two reasons. The CI runner has no
# GPU, so the ~3 GB of nvidia-* wheels the `and-cuda` extra pulls are downloaded
# and never used; and the models here are small enough (GRU 96/64, 4-head
# attention over a 20x74 input, ~1600 samples) that kernel-launch overhead makes
# a GPU no faster than CPU anyway. The marker keeps `--extra gpu` from exploding
# on macOS and arm64, where those wheels do not exist.
#
#     uv sync --extra gpu        # on an x86_64 Linux box with a GPU
gpu = [
    "tensorflow[and-cuda]>=2.19.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Docs build only; kept out of `dev` so `uv sync --group docs` in CI does not
# drag in the test stack, and out of the runtime deps so users installing the
# library do not pay for a static-site generator.
docs = [
    "mkdocs-material>=9.5",
]
