[project]
name = "ilotto"
version = "0.1.0"
description = "An honest benchmark of lottery-prediction methods against the Israeli 6/37 Lotto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.1.0",
    "flake8>=7.1.2",
    "h5py>=3.13.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.1",
    "mdutils>=1.6.0",
    "numba>=0.61.0",
    "pandas>=2.2.3",
    "pydot>=3.0.4",
    "pydotplus>=2.0.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "ruff>=0.11.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "tensorflow[and-cuda]>=2.19.0",
    "tqdm>=4.67.1",
]


[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` does not put the project root on sys.path the way
# `python -m pytest` does, so `bench` would not import under CI without this.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
